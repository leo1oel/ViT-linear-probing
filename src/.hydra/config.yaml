data:
  dataset_name: ${dataset.name}
  data_path: ${dataset.data_path}
  cache_dir: ${hydra:runtime.cwd}/cached_features/${dataset.name}
extractor:
  batch_size: 512
  num_workers: 8
  device: cuda
  max_samples: null
  splits:
  - train
  - val
probe:
  type: linear
  batch_size: 2048
  epochs: 50
  save_dir: ${hydra:runtime.cwd}/results/${dataset.name}
  warmup_epochs: 10
  learning_rate: 0.001
  weight_decay: 0
  hyperparameter_search:
    enabled: true
    quick_epochs: 5
    learning_rates:
    - 1.0e-06
    - 1.0e-05
    - 0.0001
    - 0.001
    weight_decays:
    - 0
    - 1.0e-06
    - 0.001
steps_per_epoch: null
model:
  name: CLIP
  pretrained: openai/clip-vit-base-patch16
dataset:
  name: imagenet
  data_path: /pasteur/u/yuhuiz/data/ImageNet/imagenet
  num_classes: 1000
  input_size: 224
deepspeed:
  enabled: true
  stage: 1
  offload_optimizer: false
  offload_param: false
  contiguous_gradients: true
  overlap_comm: true
  allgather_partitions: true
  reduce_scatter: true
  allgather_bucket_size: 500000000.0
  reduce_bucket_size: 500000000.0
  train_micro_batch_size_per_gpu: ${probe.batch_size}
  zero_optimization:
    stage: 1
    allgather_partitions: true
    allgather_bucket_size: 500000000.0
    overlap_comm: true
    reduce_scatter: true
    reduce_bucket_size: 500000000.0
    contiguous_gradients: true
  gradient_accumulation_steps: 1
  gradient_clipping: 1.0
  prescale_gradients: false
  wall_clock_breakdown: false
  fp16:
    enabled: false
    loss_scale: 0
    initial_scale_power: 16
    loss_scale_window: 1000
    hysteresis: 2
    min_loss_scale: 1
  optimizer:
    type: AdamW
    params:
      lr: ${probe.learning_rate}
      weight_decay: ${probe.weight_decay}
      betas:
      - 0.9
      - 0.999
      eps: 1.0e-08
  scheduler:
    type: WarmupDecayLR
    params:
      warmup_min_lr: 0
      warmup_max_lr: ${probe.learning_rate}
      warmup_num_steps: null
      total_num_steps: null
  zero_allow_untested_optimizer: true
  communication_data_type: fp32
  round_robin_gradients: false
