hydra:
  run:
    dir: .
  sweep:
    dir: .
    subdir: .
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    root:
      level: ERROR
    disable_existing_loggers: true
  job_logging:
    version: 1
    root:
      level: ERROR
    disable_existing_loggers: true
  env: {}
  mode: MULTIRUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.mode=MULTIRUN
    task:
    - model=clip
  job:
    name: linear_probe
    chdir: false
    override_dirname: model=clip
    id: ???
    num: ???
    config_name: config
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.2
    version_base: '1.3'
    cwd: /pasteur2/u/yuhuiz/yiming/experiments/src
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /pasteur2/u/yuhuiz/yiming/experiments/conf
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: ???
    choices:
      local_rank: 0
      deepspeed: zero1
      dataset: imagenet
      model: clip
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: disabled
      hydra/hydra_logging: disabled
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
data:
  dataset_name: ${dataset.name}
  data_path: ${dataset.data_path}
  cache_dir: ${hydra:runtime.cwd}/cached_features/${dataset.name}
extractor:
  batch_size: 512
  num_workers: 8
  device: cuda
  max_samples: null
  splits:
  - train
  - val
probe:
  type: linear
  batch_size: 2048
  epochs: 50
  save_dir: ${hydra:runtime.cwd}/results/${dataset.name}
  warmup_epochs: 10
  learning_rate: 0.001
  weight_decay: 0
  hyperparameter_search:
    enabled: true
    quick_epochs: 5
    learning_rates:
    - 1.0e-06
    - 1.0e-05
    - 0.0001
    - 0.001
    weight_decays:
    - 0
    - 1.0e-06
    - 0.001
steps_per_epoch: null
model:
  name: CLIP
  pretrained: openai/clip-vit-base-patch16
dataset:
  name: imagenet
  data_path: /pasteur/u/yuhuiz/data/ImageNet/imagenet
  num_classes: 1000
  input_size: 224
deepspeed:
  enabled: true
  stage: 1
  offload_optimizer: false
  offload_param: false
  contiguous_gradients: true
  overlap_comm: true
  allgather_partitions: true
  reduce_scatter: true
  allgather_bucket_size: 500000000.0
  reduce_bucket_size: 500000000.0
  train_micro_batch_size_per_gpu: ${probe.batch_size}
  zero_optimization:
    stage: 1
    allgather_partitions: true
    allgather_bucket_size: 500000000.0
    overlap_comm: true
    reduce_scatter: true
    reduce_bucket_size: 500000000.0
    contiguous_gradients: true
  gradient_accumulation_steps: 1
  gradient_clipping: 1.0
  prescale_gradients: false
  wall_clock_breakdown: false
  fp16:
    enabled: false
    loss_scale: 0
    initial_scale_power: 16
    loss_scale_window: 1000
    hysteresis: 2
    min_loss_scale: 1
  optimizer:
    type: AdamW
    params:
      lr: ${probe.learning_rate}
      weight_decay: ${probe.weight_decay}
      betas:
      - 0.9
      - 0.999
      eps: 1.0e-08
  scheduler:
    type: WarmupDecayLR
    params:
      warmup_min_lr: 0
      warmup_max_lr: ${probe.learning_rate}
      warmup_num_steps: null
      total_num_steps: null
  zero_allow_untested_optimizer: true
  communication_data_type: fp32
  round_robin_gradients: false
