defaults:
  - _self_
  - model: clip
  - dataset: imagenet
  - override hydra/hydra_logging: disabled
  - override hydra/job_logging: disabled

# 全局配置
data:
  dataset_name: ${dataset.name}  # 从dataset配置中获取名称
  data_path: ${dataset.data_path}  # 从dataset配置中获取路径
  cache_dir: ${hydra:runtime.cwd}/cached_features/${dataset.name}

# 特征提取配置
extractor:
  batch_size: 256
  num_workers: 8
  device: cuda
  max_samples: null  # 每个类别的最大样本数，null表示使用所有样本
  splits: ["train", "val"]  # 需要提取特征的数据集划分，可选 ["train"], ["val"], 或 ["train", "val"]

# 线性探测配置
probe:
  # 基础训练参数
  batch_size: 1024
  epochs: 100
  save_dir: ${hydra:runtime.cwd}/results/${dataset.name}
  warmup_epochs: 10
  learning_rate: 2e-2
  weight_decay: 1e-6
  
  # 超参数搜索配置
  hyperparameter_search:
    enabled: true
    quick_epochs: 10  # 快速训练的轮数
    learning_rates: [1e-3, 1e-2, 2e-2, 5e-2]
    weight_decays: [0, 1e-6, 1e-3]

hydra:
  run:
    dir: outputs/${dataset.name}/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: multirun/${dataset.name}/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.override_dirname}
